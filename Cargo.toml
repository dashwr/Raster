[package]
name = "raster"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Solwired Raster: desktop app for the omp-dsh agent runtime"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "7bd9aaf156a872da8fb39f1525e3ae4abf53355a" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7bd9aaf156a872da8fb39f1525e3ae4abf53355a", features = ["markdown", "mermaid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# rune exige que apps usem o winit e o wgpu-hal com os patches dele
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "7bd9aaf156a872da8fb39f1525e3ae4abf53355a" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "7bd9aaf156a872da8fb39f1525e3ae4abf53355a" }

[profile.release]
debug = false
codegen-units = 16
incremental = true

[profile.dev.package."*"]
opt-level = 2
